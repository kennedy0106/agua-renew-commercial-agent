name: verify
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tester
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: agua_renew_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tester -d agua_renew_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test
      - run: pnpm --filter @agua-renew/crm test
      - run: pnpm run build:crm
      - run: pnpm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://tester:test_only@localhost:5432/agua_renew_test
      - run: pnpm run eval:dry
